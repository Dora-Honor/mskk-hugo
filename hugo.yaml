services:
    # Change it to your Disqus shortname before using
    disqus:
        shortname: "hugo-theme-stack"
    # GA Tracking ID
    googleAnalytics:
        id:

pagination:
    pagerSize: 3

permalinks:
    post: /p/:slug/
    page: /:slug/

params:
    fancybox: true
    mainSections:
        - post
    featuredImageField: image
    rssFullContent: true
    favicon: /favicon.ico # e.g.: favicon placed in `static/favicon.ico` of your site folder, then set this field to `/favicon.ico` (`/` is necessary)

    footer:
        since: 2020
        customText:

    dateFormat:
        published: Jan 02, 2006
        lastUpdated: Jan 02, 2006 15:04 MST

    sidebar:
        emoji: 😘
        subtitle: 大家我都喜欢哦
        avatar:
            enabled: true
            local: true
            src: img/user.webp

    article:
        math: false
        toc: true
        readingTime: true
        license:
            enabled: true
            default: Licensed under CC BY-NC-SA 4.0

    comments:
        enabled: true
        provider: waline

        disqusjs:
            shortname:
            apiUrl:
            apiKey:
            admin:
            adminLabel:

        utterances:
            repo:
            issueTerm: pathname
            label:

        beaudar:
            repo:
            issueTerm: pathname
            label:
            theme:

        remark42:
            host:
            site:
            locale:

        vssue:
            platform:
            owner:
            repo:
            clientId:
            clientSecret:
            autoCreateIssue: false

        # Waline client configuration see: https://waline.js.org/en/reference/component.html
        waline:
            serverURL: https://comment.dorahonor.me/
            # serverURL1: https://comment.dorahonor.me/
                # UI: https://commment.dorahonor.me/ui/
            # serverURL2: https://vercel-waline.dorahonor.me/
                # UI: https://vercel-waline.dorahonor.me/ui/
            # serverURL3: https://waline.dorahonor.me/.netlify/functions/comment
                # UI: https://waline.dorahonor.me/.netlify/functions/comment/ui/
            lang: zh-CN
            pageview: false
            reaction: true
            emoji:
                - https://unpkg.com/@waline/emojis@1.0.1/weibo
                - https://unpkg.com/@waline/emojis@1.1.0/alus
                - https://unpkg.com/@waline/emojis@1.1.0/bilibili
                - https://unpkg.com/@waline/emojis@1.1.0/qq
                - https://unpkg.com/@waline/emojis@1.1.0/tieba
                - https://unpkg.com/@waline/emojis@1.1.0/tw-emoji
                - https://emoji.shojo.cn/bili/webp/乖巧宝宝
                - https://emoji.shojo.cn/bili/webp/乖巧宝宝%20清凉一夏
                - https://emoji.shojo.cn/bili/webp/原神
                - https://emoji.shojo.cn/bili/webp/原神-须弥
                - https://emoji.shojo.cn/bili/webp/原神·巡林奇遇
                - https://emoji.shojo.cn/bili/webp/崩坏：星穹铁道
                - https://emoji.shojo.cn/bili/webp/崩坏3
                - https://emoji.shojo.cn/bili/webp/崩坏3·光辉矢愿
                - https://emoji.shojo.cn/bili/webp/崩坏3·天穹流星
                - https://emoji.shojo.cn/bili/webp/崩坏3·终焉归始
                - https://emoji.shojo.cn/bili/webp/崩坏3·雷鸣彻空
                - https://emoji.shojo.cn/bili/webp/崩坏学园2
                - https://emoji.shojo.cn/bili/webp/明日方舟
                - https://emoji.shojo.cn/bili/webp/明日方舟音律联觉
                - https://emoji.shojo.cn/bili/webp/明日方舟·音律联觉-灯下定影
                - https://emoji.shojo.cn/bili/webp/我的世界
                - https://emoji.shojo.cn/bili/webp/tv_小电视_动图
                - https://emoji.shojo.cn/bili/webp/罗小黑战记
                - https://emoji.shojo.cn/bili/webp/2233娘
            requiredMeta:
                - name
                - email
                # - url
            locale:
                admin: Admin
                placeholder: 说点什么吧（昵称和邮箱为必填项。为了你能及时收到相关回复的邮件通知，请确保邮箱的正确性！）

        twikoo:
            envId:
            region:
            path:
            lang:

        # See https://cactus.chat/docs/reference/web-client/#configuration for description of the various options
        cactus:
            defaultHomeserverUrl: "https://matrix.cactus.chat:8448"
            serverName: "cactus.chat"
            siteName: "" # You must insert a unique identifier here matching the one you registered (See https://cactus.chat/docs/getting-started/quick-start/#register-your-site)

        giscus:
            repo:
            repoID:
            category:
            categoryID:
            mapping:
            lightTheme:
            darkTheme:
            reactionsEnabled: 1
            emitMetadata: 0

        gitalk:
            owner:
            admin:
            repo:
            clientID:
            clientSecret:
            proxy:

        cusdis:
            host:
            id:
    widgets:
        homepage:
            - type: search
            - type: archives
              params:
                  limit: 5
            - type: categories
              params:
                  limit: 10
            - type: tag-cloud
              params:
                  limit: 10
        page:
            - type: toc

    opengraph:
        twitter:
            # Your Twitter username
            site:

            # Available values: summary, summary_large_image
            card: summary_large_image

    defaultImage:
        opengraph:
            enabled: false
            local: false
            src:

    colorScheme:
        # Display toggle
        toggle: true

        # Available values: auto, light, dark
        default: auto

    imageProcessing:
        cover:
            enabled: true
        content:
            enabled: true

